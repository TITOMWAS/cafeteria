name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — syntax & boot check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Syntax-check all sources
        run: |
          for f in index.js controllers/*.js routes/*.js utils/*.js middleware/*.js config/*.js; do
            node --check "$f"
          done
      - name: Smoke-load app (no DB connection required)
        env:
          JWT_SECRET: ci-test-secret
          NODE_ENV: test
        run: node -e "require('./index.js'); setTimeout(() => process.exit(0), 1500)"

  frontend:
    name: Frontend — build & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Unit tests (vitest)
        run: npm test
      - name: Production build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t cafeteria-backend ./backend
      - name: Build frontend image
        run: docker build -t cafeteria-frontend ./frontend
