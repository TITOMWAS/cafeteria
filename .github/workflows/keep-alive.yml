name: Keep backend awake

# Render's free tier spins the service down after ~15 minutes without traffic,
# making the first request take 30-60s while it cold-boots. Pinging /api/health
# every 10 minutes keeps the instance warm.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$BACKEND_URL/api/health")
          echo "Health check returned HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Backend health check failed (HTTP $STATUS)"
          fi
        env:
          BACKEND_URL: https://cafeteria-backend-x8qm.onrender.com
