services:
  db:
    image: postgres:16-alpine
    container_name: cafeteria_db_container
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cafeteria_db
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cafeteria_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cafeteria_backend_container
    restart: always
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/cafeteria_db
      - PORT=5001
      - JWT_SECRET=cafeteria_secret_jwt_2026
      - NODE_ENV=development
      - PAYHERO_USERNAME=${PAYHERO_USERNAME:-}
      - PAYHERO_PASSWORD=${PAYHERO_PASSWORD:-}
      - PAYHERO_CHANNEL_ID=${PAYHERO_CHANNEL_ID:-}
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cafeteria_frontend_container
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
